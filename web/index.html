<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Rigid Body Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: the simulation fills the screen. Name and scene picker float at the top,
     the explanation, energy readout and controls sit along the bottom. */
  :root {
    --bg: #e4ebf1;
    --floor: #d2dce5;
    --grid: #b3c1ce;
    --ink: #13253a;
    --muted: #4a5d73;
    --panel: #f5f8fa;
    --line: #c3cfda;
    --accent: #1f4fd1;
    --on-accent: #ffffff;
    --c1: #2a5bd7;
    --c2: #e3a019;
    --c3: #169c8c;
    --c4: #c93a5e;
    --display: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1620; --floor: #162231; --grid: #2a3b4f; --ink: #dde7f1; --muted: #9db0c4;
      --panel: #172433; --line: #2c3e53; --accent: #7aa2ff; --on-accent: #0b1422;
      --c1: #6b95ff; --c2: #f0b63f; --c3: #37c2b0; --c4: #ec6a8b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1620; --floor: #162231; --grid: #2a3b4f; --ink: #dde7f1; --muted: #9db0c4;
    --panel: #172433; --line: #2c3e53; --accent: #7aa2ff; --on-accent: #0b1422;
    --c1: #6b95ff; --c2: #f0b63f; --c3: #37c2b0; --c4: #ec6a8b;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--body); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

  /* Overlays let pointer events through to the canvas except on their controls. */
  .overlay {
    position: fixed; left: 0; right: 0; pointer-events: none;
    display: flex; flex-direction: column; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  h1 { margin: 0; font: 600 20px/1.1 var(--display); letter-spacing: -0.01em; }
  #note { margin: 0; max-width: 62ch; font-size: 15px; text-wrap: pretty; }
  .hint { margin: 0; max-width: 62ch; color: var(--muted); font-size: 12.5px; }
  #energy { font: 500 13px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--muted); margin-right: auto; }

  button {
    pointer-events: auto; cursor: pointer;
    font: 500 13px/1 var(--display); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; } /* or a flex row's display would show it */
  button[aria-pressed="true"], #fire { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>

<canvas id="view" aria-label="3D physics simulation"></canvas>

<div class="overlay top">
  <h1>Rigid Body Lab</h1>
  <nav class="row" id="scenes" aria-label="Scene"></nav>
</div>

<div class="overlay bottom">
  <p id="note">Loading the simulation.</p>
  <div class="row">
    <span id="energy"></span>
    <button id="fire" type="button">Fire ball</button>
    <button id="brakes" type="button" aria-pressed="false" hidden>Brakes fail</button>
    <span id="pace" class="row" role="group" aria-label="Walking pace" hidden>
      <button type="button" data-pace="0" aria-pressed="false">Stand</button>
      <button type="button" data-pace="1.36" aria-pressed="true">Walk</button>
      <button type="button" data-pace="1.6" aria-pressed="false">Hurry</button>
    </span>
    <button id="pause" type="button">Pause</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script>
// Scene ids match src/scenes.rs. `group` = bodies sharing a colour; view = [azimuth, polar, distance, target].
const SCENES = [
  { name: 'Brick wall', group: 1, view: [0.45, 1.25, 12, [0, 1.4, 0]],
    note: '36 bricks at rest. Fire a ball into them, or drag one out of the bottom row.' },
  { name: 'Dominoes', group: 1, view: [1.9, 0.85, 17, [2.5, 0, 0]],
    note: 'Each domino only has to tip the next one. Drag one out of the line to stop the wave.' },
  { name: 'Newton’s cradle', group: 1, view: [0.35, 1.35, 7.5, [0, 1.7, 0]],
    note: 'Momentum and energy both have to be passed on, so one ball in means one ball out. Pull two balls back and let go.' },
  { name: 'Chaos', group: 2, view: [0.3, 1.45, 8.5, [0, 2.7, 0]],
    note: 'Three double pendulums released 0.001 radians apart. They move as one for a few seconds, then go their own ways.' },
  { name: 'Tennis racket', group: 1, view: [0, 1.25, 8.5, [0, 2.5, 0]],
    note: 'Zero gravity. Each slab spins about a different axis. Spin about the shortest or longest axis holds steady. Spin about the middle one flips over, again and again.' },
  { name: 'Block tower', group: 3, view: [0.6, 1.2, 10, [0, 1.8, 0]],
    note: '36 planks in 12 crossed layers. Drag a plank out of the middle and see how long the tower stands, or fire a ball at it.' },
  // Robots in joint coordinates (src/robot.rs). Ids 6 and up; see FIRST_ROBOT_SCENE in src/ffi.rs.
  { name: 'Cart-pole', robot: true, group: 1, view: [0, 1.35, 7, [0, 1.5, 0]],
    note: 'One motor moves the cart; the pole swings freely. The controller pumps the swing until the pole is nearly upright, then balances it. Drag the pole down and it starts again.' },
  { name: 'Robot arm', robot: true, group: 1, view: [0.7, 1.3, 3.8, [0.3, 0.7, 0]],
    note: 'Four motors keep the tip on the moving ball: a virtual spring from tip to target, plus the torque that cancels gravity. Drag any link to fight it.' },
  { name: 'Double pendulum', robot: true, group: 1, view: [0, 1.4, 7, [0, 2.2, 0]],
    note: 'Two links and no motors. Nothing adds or removes energy, so the readout should stay at 100% however wild the motion gets.' },
  { name: 'Hopper', robot: true, group: 1, view: [0, 1.35, 9, [0, 1, 0]],
    note: 'One springy leg, free to move and fall. It balances only by choosing where to put its foot on each landing, and hops between two marks. Drag the body to shove it.' },
  { name: 'Learning to balance', robot: true, learning: true, group: 1, view: [0, 1.35, 7, [0, 1.5, 0]],
    note: 'Nobody programmed this one. It tries random motor rules, keeps whichever held the pole up longest, and nudges that. Expect a few dozen short failures, then ten-second balances.' },
  { name: 'Trained hopper', robot: true, trained: true, follow: 2, group: 1, view: [0, 1.35, 9, [0, 1, 0]],
    note: 'The same hopper, but its motors are driven by a neural network trained by reinforcement learning (PPO, a million steps of practice) to move right without falling. Each run lasts ten seconds, then starts again from a slightly different pose.' },
];
// Scenes added later, out of order: ids must match src/scenes.rs and src/ffi.rs.
SCENES[12] = { name: 'Car', car: true, follow: 0, group: 1, view: [-0.5, 1.15, 14, [0, 0.6, 30]],
  note: 'A 1200 kg car on four springs. Each tyre grips according to how much it slips, so in the bends the body rolls, the outer tyres carry most of the weight, and the front tyres point a few degrees inside the way the car goes. It speeds up and brakes every 8 s. Drive it yourself with the arrow keys or WASD, into the crates if you like.' };
SCENES[13] = { name: 'Walking person', robot: true, walking: true, follow: 3, person: true, group: 3, view: [0.5, 1.3, 5, [0, 0.9, 0]],
  note: 'A 70 kg body with hip, knee and ankle motors about as strong as human muscle, and no animation: every step is physics. Its joints aim for the angles of one real person walking slowly, normally and briskly, recorded by motion capture and blended by speed, and a small neural network trained by trial and error corrects them so it keeps its balance. Stand stops it on both feet, balancing at the ankles; Walk and Hurry set it off. A small tug on the torso makes it stumble and recover; yank it and it falls, lies still a moment, and gets up again (a second network, trained to get up from falls).' };
SCENES[15] = { name: 'Walking in 3D', robot: true, walking3d: true, follow: 5, person: true, group: 3, view: [0.9, 1.25, 6, [0, 0.9, 0]],
  note: 'The same body free to fall sideways and turn: 22 joints, with hips that also swing out and twist and ankles that also roll. It walks with the same motion-captured gait as the walking person, and balances sideways the way people do, stepping further out when it tips; a neural network trained in 3D corrects both. Tug it sideways to watch it catch itself.' };
SCENES[14] = { name: 'Crossing', robot: true, crossing: true, person: true, group: 1, view: [Math.PI, 1.2, 16, [30.5, 0.6, 3]],
  note: 'The same car and the same walking person, now sharing the road. The car sees someone stepping off the kerb, works out where it must start braking to stop 4 m short (from v² = 2·a·d), waits while they cross, and drives on; it also stops for someone waiting at the zebra if it can do so gently. The person judges the car as people do: they wait at the kerb if it is close and not slowing, and hurry if it bears down on them mid-crossing. Nobody is scripted: the car brakes through its tyres and the person walks on their own legs. Press Brakes fail to see what happens when it cannot stop: the two collide, and momentum passes between them.' };
const DT = 1 / 60;
const $ = id => document.getElementById(id);
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const canvas = $('view');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(7, 14, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0x8a9bb0, 0.5));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial());
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
const rods = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial());
rods.frustumCulled = false;
// The car scene's circular road, 7 m wide.
// Drawn just in front of the floor at any distance (polygon offset), not 4 mm above it,
// which the depth buffer cannot tell apart from far away.
const road = new THREE.Mesh(new THREE.RingGeometry(26.5, 33.5, 160),
  new THREE.MeshLambertMaterial({ polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
road.rotation.x = -Math.PI / 2;
road.position.y = 0.004;
road.receiveShadow = true;
scene.add(floor, rods, road);

// Road markings: a dashed centre line round the circle, and a zebra crossing where the
// person's path (the x axis) crosses the road. Stripes run along the traffic, as on real roads.
const paint = new THREE.MeshLambertMaterial({ color: 0xf2f2ee, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const markings = new THREE.Group(), zebra = new THREE.Group();
for (let k = 0; k < 64; k++) {
  const a = (k / 64) * Math.PI * 2, dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.4), paint);
  dash.rotation.set(-Math.PI / 2, 0, -a);
  dash.position.set(30 * Math.cos(a), 0.006, 30 * Math.sin(a));
  markings.add(dash);
}
for (let x = 27; x <= 33; x += 1) {
  const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), paint);
  stripe.rotation.x = -Math.PI / 2;
  stripe.position.set(x, 0.007, 0);
  zebra.add(stripe);
}
markings.traverse(o => { o.receiveShadow = true; });
zebra.traverse(o => { o.receiveShadow = true; });
scene.add(markings, zebra);

// The walker's floor profile (slopes, steps, the pavement and its dropped kerbs), extruded
// across the path: a top surface and a side face down to the ground.
const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0xb9b2a6, roughness: 0.9 });
let terrainMesh = null;
function buildTerrain(halfWidth) {
  if (terrainMesh) { scene.remove(terrainMesh); terrainMesh.geometry.dispose(); terrainMesh = null; }
  const n = wasm.terrain(0, 2);
  if (!n) return;
  const p = [...Array(n)].map((_, i) => [wasm.terrain(i, 0), wasm.terrain(i, 1)]);
  p.unshift([p[0][0] - 60, p[0][1]]); p.push([p[n][0] + 60, p[n][1]]); // level beyond the ends
  const v = [];
  const quad = (a, b, c, d) => v.push(...a, ...b, ...c, ...a, ...c, ...d);
  for (let i = 0; i + 1 < p.length; i++) {
    const [[x0, y0], [x1, y1]] = [p[i], p[i + 1]];
    quad([x0, y0, halfWidth], [x1, y1, halfWidth], [x1, y1, -halfWidth], [x0, y0, -halfWidth]);
    quad([x0, 0, halfWidth], [x1, 0, halfWidth], [x1, y1, halfWidth], [x0, y0, halfWidth]);
    quad([x1, 0, -halfWidth], [x0, 0, -halfWidth], [x0, y0, -halfWidth], [x1, y1, -halfWidth]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  terrainMesh = new THREE.Mesh(g, terrainMaterial);
  terrainMesh.receiveShadow = terrainMesh.castShadow = true;
  scene.add(terrainMesh);
}
let tailLights = null;

// The walking person drawn as a person: rounded, tapered limbs in clothes, over the same
// links the physics moves (link order from robot::walker). Shapes are drawing only.
const SKIN = 0xc8906b, SHIRT = 0x2f6fd0, TROUSERS = 0x323d4c, SHOE = 0x1d2127;
const coat = c => new THREE.MeshStandardMaterial({ color: new THREE.Color(c).convertSRGBToLinear(), roughness: 0.75 });
// A limb: a cone-like cylinder from radius r1 (top) to r2 (bottom) over length len, with round ends.
function limb(len, r1, r2, material) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, 18), material));
  const top = new THREE.Mesh(new THREE.SphereGeometry(r1, 18, 12), material);
  const bottom = new THREE.Mesh(new THREE.SphereGeometry(r2, 18, 12), material);
  top.position.y = len / 2;
  bottom.position.y = -len / 2;
  g.add(top, bottom);
  return g;
}
function blob(rx, ry, rz, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), material);
  m.scale.set(rx, ry, rz);
  m.position.set(x, y, z);
  return m;
}
// Each part is centred on its link's centre of mass, x forward, y up the limb, z sideways.
// `part` is robot::Part, from the wasm export walker_part.
function bodyPart(part) {
  const g = new THREE.Group();
  const [skin, shirt, trousers, shoe] = [SKIN, SHIRT, TROUSERS, SHOE].map(coat);
  switch (part) {
    case 1: { // torso, from the hips up, with the head
      const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.15, 0.5, 24), shirt);
      chest.scale.x = 0.62;
      chest.position.y = 0.04;
      g.add(chest, blob(0.11, 0.07, 0.19, shirt, 0, 0.29), blob(0.12, 0.12, 0.17, trousers, 0, -0.27));
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.1, 12), skin);
      neck.position.y = 0.36;
      g.add(neck, blob(0.095, 0.115, 0.085, skin, 0.01, 0.47), blob(0.1, 0.06, 0.09, new THREE.MeshStandardMaterial({ color: 0x2b211c, roughness: 0.9 }), -0.01, 0.53));
      break;
    }
    case 2: g.add(limb(0.38, 0.075, 0.055, trousers)); break; // thigh
    case 3: g.add(limb(0.38, 0.055, 0.042, trousers)); break; // shin
    case 4: g.add(blob(0.13, 0.045, 0.05, shoe, 0.0, -0.005)); break; // shoe, heel to toe
    case 5: g.add(limb(0.22, 0.048, 0.04, shirt)); break; // upper arm
    case 6: g.add(limb(0.22, 0.038, 0.03, skin), blob(0.035, 0.05, 0.03, skin, 0, -0.16)); break; // forearm and hand
    default: g.visible = false; // the free base joints and the centre-of-mass marker
  }
  return g;
}

// The car is drawn car-shaped: a side profile (bonnet, windscreen, roof, boot) extruded
// across its width with rounded edges, a glass cabin, lights. The physics body stays a box
// (hidden), so this is drawing only.
function dressCar(body, b) {
  const [hx, hy, hz] = [b[8], b[9], b[10]];
  body.material.visible = false;
  body.children.forEach(c => { c.visible = false; }); // the box's outline
  const paint = new THREE.MeshStandardMaterial({ color: body.material.color, roughness: 0.35, metalness: 0.2 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x18222e, roughness: 0.15, metalness: 0.4 });
  const extrude = (points, width, material) => {
    const shape = new THREE.Shape(points.map(([x, y]) => new THREE.Vector2(x, y)));
    const g = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 3 });
    g.translate(0, 0, -width / 2);
    const m = new THREE.Mesh(g, material);
    m.castShadow = m.receiveShadow = true;
    body.add(m);
  };
  // Side profiles in the body's frame: x forward, y up, the box spanning ±hx and ±hy.
  extrude([[-hx, -hy + 0.05], [hx, -hy + 0.05], [hx + 0.05, -0.05], [hx - 0.1, hy - 0.1], [hx * 0.4, hy],
    [-hx * 0.85, hy], [-hx, hy - 0.08]], hz * 2 - 0.1, paint);
  extrude([[hx * 0.4, hy - 0.02], [hx * 0.05, hy + 0.48], [-hx * 0.5, hy + 0.48], [-hx * 0.85, hy - 0.02]], hz * 1.7, glass);
  extrude([[hx * 0.02, hy + 0.47], [-hx * 0.48, hy + 0.47], [-hx * 0.48, hy + 0.5], [hx * 0.02, hy + 0.5]], hz * 1.72, paint);
  const lamp = (x, z, color, emissive) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.28), new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: 0.6 }));
    m.position.set(x, 0.05, z);
    body.add(m);
    return m;
  };
  for (const z of [hz * 0.65, -hz * 0.65]) lamp(hx + 0.06, z, 0xfff6d8, 0xfff2c0);
  // Both tail lights share one material, so the simulated brake pedal lights the pair.
  const tail = lamp(-hx - 0.06, hz * 0.65, 0x7a0d0d, 0xff2a1a);
  tailLights = tail.material;
  const right = tail.clone();
  right.position.z = -hz * 0.65;
  body.add(right);
}

let wasm, current = 0, meshes = [], colors, startEnergy = null;
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
const orbit = { theta: 0, phi: 1, dist: 10, target: new THREE.Vector3() };

function clearBodies() {
  for (const m of meshes) {
    scene.remove(m);
    m.traverse(o => o.geometry?.dispose());
  }
  meshes = [];
}

// The 3D scene takes its colours from the same CSS tokens as the page, in both themes.
function applyTheme() {
  const css = getComputedStyle(document.documentElement);
  const token = name => new THREE.Color(css.getPropertyValue(name).trim());
  // Materials are lit in linear light, so their colours need converting; the background is drawn as is.
  const lit = name => token(name).convertSRGBToLinear();
  colors = { ink: lit('--ink'), bodies: ['--c1', '--c2', '--c3', '--c4'].map(lit) };
  scene.background = token('--bg');
  scene.fog = new THREE.Fog(scene.background, 18, 60); // fog is mixed in after output encoding, so no conversion
  // The grid is painted into the floor's texture, one tile per metre. Drawn as lines it went
  // missing on some renderers wherever a line passed behind the camera; a textured floor cannot.
  const tile = document.createElement('canvas');
  tile.width = tile.height = 128;
  const paint = tile.getContext('2d');
  paint.fillStyle = css.getPropertyValue('--floor');
  paint.fillRect(0, 0, 128, 128);
  paint.fillStyle = css.getPropertyValue('--grid');
  paint.fillRect(0, 0, 128, 3);
  paint.fillRect(0, 0, 3, 128);
  floor.material.map?.dispose();
  floor.material.map = Object.assign(new THREE.CanvasTexture(tile), {
    wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping,
    anisotropy: renderer.capabilities.getMaxAnisotropy(), encoding: THREE.sRGBEncoding,
  });
  floor.material.map.repeat.set(600, 600);
  floor.material.needsUpdate = true;
  rods.material.color = colors.ink;
  road.material.color = lit('--grid');
  clearBodies();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function loadScene(id) {
  current = id;
  wasm.load(id);
  clearBodies();
  startEnergy = null;
  const [theta, phi, dist, target] = SCENES[id].view;
  Object.assign(orbit, { theta, phi, dist });
  orbit.target.fromArray(target);
  $('note').textContent = SCENES[id].note;
  [...$('scenes').children].forEach(b => b.setAttribute('aria-pressed', +b.dataset.id === id));
  $('fire').hidden = !!SCENES[id].robot; // robots have no contact yet
  $('brakes').hidden = !SCENES[id].crossing; // loading the scene gives the car working brakes again
  $('brakes').setAttribute('aria-pressed', 'false');
  $('pace').hidden = !SCENES[id].walking;
  [...$('pace').children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pace === '1.36')));
  road.visible = markings.visible = !!(SCENES[id].car || SCENES[id].crossing);
  zebra.visible = !!SCENES[id].crossing;
  buildTerrain(SCENES[id].crossing ? 1.5 : 0.8);
  tailLights = null;
  const watching = SCENES[id].learning || SCENES[id].trained; // these robots cannot be dragged
  $('hint').textContent = (watching ? 'Drag' : 'Drag an object to pull it around. Drag empty space') + ' to look around, scroll to zoom'
    + (SCENES[id].robot ? '.' : ', double-click to fire a ball at that spot.')
    + (SCENES[id].car ? ' Arrow keys or WASD to drive, Reset for the autopilot.' : '');
}

// Copies body poses out of wasm memory into the meshes; creates meshes for new bodies.
function sync() {
  const ptr = wasm.state();
  const [n, joints, energy] = new Float32Array(wasm.memory.buffer, ptr, 3);
  const s = new Float32Array(wasm.memory.buffer, ptr, 3 + n * 11 + joints * 6);
  for (let i = 1; i < n; i++) { // body 0 is the ground
    const b = s.subarray(3 + i * 11, 14 + i * 11);
    let mesh = meshes[i - 1];
    const { person, car, crossing } = SCENES[current];
    const first = person ? wasm.robot_first_drawn() : Infinity; // where the walker's links begin
    if (!mesh && i >= first) {
      mesh = bodyPart(wasm.walker_part(i - first));
      mesh.traverse(o => { o.castShadow = o.receiveShadow = true; o.userData.body = i; });
      scene.add(mesh);
      meshes.push(mesh);
    }
    if (!mesh && b[7] === 4) { // capsule: radius b[8], half length b[9] along its y axis
      const color = colors.bodies[Math.floor((i - 1) / SCENES[current].group) % 4];
      mesh = limb(2 * b[9], b[8], b[8], new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
      mesh.traverse(o => { o.castShadow = o.receiveShadow = true; o.userData.body = i; });
      scene.add(mesh);
      meshes.push(mesh);
    }
    if (!mesh) {
      const [box, wheel] = [b[7] === 2, b[7] === 3];
      // A wheel's 14 flat sides are outlined, so you can see it turn (and see it skid when it doesn't).
      const shape = box ? new THREE.BoxGeometry(2 * b[8], 2 * b[9], 2 * b[10])
        : wheel ? new THREE.CylinderGeometry(b[8], b[8], 2 * b[9], 14)
        : new THREE.SphereGeometry(b[8], 32, 16);
      const color = wheel ? colors.ink : colors.bodies[Math.floor((i - 1) / SCENES[current].group) % 4];
      mesh = new THREE.Mesh(shape, new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.userData.body = wheel ? null : i; // wheels are drawn only; grab the car by its body
      if (box || wheel) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(shape), new THREE.LineBasicMaterial({ color: colors.ink })));
      if (i === 1 && (car || crossing)) dressCar(mesh, b);
      scene.add(mesh);
      meshes.push(mesh);
    }
    mesh.position.set(b[0], b[1], b[2]);
    mesh.quaternion.set(b[3], b[4], b[5], b[6]);
  }
  // Tail lights glow with the simulated brake pedal.
  if (tailLights) tailLights.emissiveIntensity = 0.15 + 2.5 * wasm.car(6);
  rods.geometry.setAttribute('position', new THREE.BufferAttribute(s.slice(3 + n * 11), 3));
  startEnergy ??= energy;
  const share = startEnergy > 1e-6 ? ` · ${(100 * energy / startEnergy).toFixed(1)}% of start` : '';
  const [run, seconds, metres] = [0, 1, 2].map(wasm.player);
  $('energy').textContent = SCENES[current].learning
    ? `Attempt ${wasm.trials() + 1} · best so far ${wasm.best_seconds().toFixed(1)} s of 10`
    : SCENES[current].trained
    ? `Run ${run} · ${metres.toFixed(1)} m in ${seconds.toFixed(1)} s · ${(metres / Math.max(seconds, 0.5)).toFixed(1)} m/s average`
    : SCENES[current].crossing
    ? `Car ${wasm.car(0).toFixed(0)} km/h · ${wasm.car(9) ? (wasm.car(5) ? 'BRAKES FAILED, coasting toward the person crossing' : 'brakes failed')
      : wasm.car(5) ? 'braking for the person crossing' : 'road clear, driving on'}`
      + ` · person ${['', 'knocked down', 'getting up'][wasm.walker(7)] || (wasm.walker(4) ? 'waiting at the kerb' : wasm.walker(3) > 1.5 ? 'hurrying' : 'walking')}`
    : SCENES[current].walking3d
    ? `${wasm.walker(1)} steps · ${wasm.walker(0).toFixed(2)} m/s average · drifted ${wasm.walker(6).toFixed(2)} m sideways`
    : SCENES[current].walking
    ? (wasm.walker(4) ? `Standing still · ${wasm.walker(1)} steps taken`
      : `Walking, asked for ${wasm.walker(3).toFixed(2)} m/s · ${wasm.walker(1)} steps taken`)
    : SCENES[current].car
    ? `${wasm.car(0).toFixed(0)} km/h · ${wasm.car(1).toFixed(2)} g sideways · body roll ${wasm.car(2).toFixed(1)}° · front tyres slip ${wasm.car(3).toFixed(1)}°`
      + ` · gear ${wasm.car(7) < 0 ? 'R' : wasm.car(7)} at ${(wasm.car(8) / 1000).toFixed(1)}k rpm`
      + (wasm.car(4) ? ' · autopilot' : '')
    : `Energy ${energy.toFixed(3)} J${share}`;
}

// Pointer: grab the body under the cursor, otherwise orbit the camera.
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2(), dragPlane = new THREE.Plane(), spot = new THREE.Vector3();
let mode = null, lastX = 0, lastY = 0;
function aim(x, y) {
  const r = canvas.getBoundingClientRect();
  pointer.set((x - r.left) / r.width * 2 - 1, 1 - (y - r.top) / r.height * 2);
  ray.setFromCamera(pointer, camera);
}
function fire() {
  const o = camera.position, d = ray.ray.direction;
  wasm.shoot(o.x, o.y, o.z, d.x * 25, d.y * 25, d.z * 25);
}
canvas.addEventListener('pointerdown', e => {
  if (mode) return;
  canvas.setPointerCapture(e.pointerId);
  [lastX, lastY] = [e.clientX, e.clientY];
  aim(e.clientX, e.clientY);
  const hit = ray.intersectObjects(meshes, true).find(h => h.object.userData.body != null);
  mode = hit ? 'grab' : 'orbit';
  if (hit) {
    // Drag in the plane that faces the camera and passes through the grabbed point.
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(spot), hit.point);
    wasm.grab(hit.object.userData.body, hit.point.x, hit.point.y, hit.point.z);
  }
});
canvas.addEventListener('pointermove', e => {
  if (mode === 'grab') {
    aim(e.clientX, e.clientY);
    if (ray.ray.intersectPlane(dragPlane, spot)) wasm.drag(spot.x, Math.max(spot.y, 0.05), spot.z);
  } else if (mode === 'orbit') {
    orbit.theta -= (e.clientX - lastX) * 0.006;
    orbit.phi = clamp(orbit.phi - (e.clientY - lastY) * 0.006, 0.15, 1.5);
  }
  [lastX, lastY] = [e.clientX, e.clientY];
});
const endPointer = () => {
  if (mode === 'grab') wasm.release();
  mode = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.dist = clamp(orbit.dist * Math.exp(e.deltaY * 0.001), 3, 45);
}, { passive: false });
canvas.addEventListener('dblclick', e => {
  if (SCENES[current].robot) return;
  aim(e.clientX, e.clientY);
  fire();
});

$('fire').onclick = () => {
  aim(innerWidth / 2, innerHeight / 2);
  fire();
};
$('reset').onclick = () => loadScene(current);
$('brakes').onclick = () => {
  const failed = $('brakes').getAttribute('aria-pressed') !== 'true';
  wasm.fail_brakes(failed ? 1 : 0);
  $('brakes').setAttribute('aria-pressed', String(failed));
};
$('pace').onclick = e => {
  const pace = e.target.dataset.pace;
  if (pace === undefined) return;
  wasm.set_pace(+pace);
  [...$('pace').children].forEach(b => b.setAttribute('aria-pressed', String(b === e.target)));
};
$('pause').onclick = () => {
  paused = !paused;
  $('pause').textContent = paused ? 'Play' : 'Pause';
};
$('pause').textContent = paused ? 'Play' : 'Pause';
// Keyboard driving in the car scene. The first key press hands over from the autopilot.
const keys = new Set();
const driveKeys = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (!SCENES[current].car || !driveKeys[e.code]) return;
  e.preventDefault();
  keys.add(driveKeys[e.code]);
});
addEventListener('keyup', e => keys.delete(driveKeys[e.code]));
addEventListener('blur', () => keys.clear());
function steerByKeys() {
  if (!SCENES[current].car || (!keys.size && wasm.car(4))) return;
  wasm.drive(keys.has('up') - keys.has('down'), keys.has('left') - keys.has('right'));
}

new Set([15, 14, 13, 12, 9, 11, 10, 6, 7, 8, 5, ...SCENES.keys()]).forEach(id => { // robots and vehicles first, then the rest
  const s = SCENES[id];
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.id = id;
  b.textContent = s.name;
  b.onclick = () => loadScene(id);
  $('scenes').append(b);
});

new ResizeObserver(() => {
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix();
}).observe(canvas);

let last = performance.now(), behind = 0;
function frame(now) {
  // Fixed 60 Hz physics steps, at most three per drawn frame.
  behind = Math.min(behind + (now - last) / 1000, 3 * DT);
  last = now;
  steerByKeys();
  for (; behind >= DT; behind -= DT) if (!paused) wasm.step(DT);
  sync();
  // Scenes that travel far keep the camera and the shadow light on one body.
  const lead = meshes[SCENES[current].follow];
  if (lead) orbit.target.set(lead.position.x, orbit.target.y, lead.position.z);
  const [ax, az] = lead ? [lead.position.x, lead.position.z] : [0, 0];
  sun.position.set(7 + ax, 14, 9 + az);
  sun.target.position.set(ax, 0, az);
  sun.target.updateMatrixWorld();
  const { theta, phi, target } = orbit;
  const dist = orbit.dist * Math.max(1, 1.15 / camera.aspect); // step back on tall, narrow screens
  camera.position.set(Math.sin(phi) * Math.sin(theta), Math.cos(phi), Math.sin(phi) * Math.cos(theta)).multiplyScalar(dist).add(target);
  camera.lookAt(target);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

fetch('sim.wasm')
  .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error(`HTTP ${r.status}`)))
  .then(bytes => WebAssembly.instantiate(bytes))
  .then(({ instance }) => {
    wasm = instance.exports;
    // Scene ids are defined in src/scenes.rs. Check this page's list against them, so a
    // mismatch shows up at once rather than as the wrong scene behind a button.
    const kindOf = s => s.walking3d ? 7 : s.crossing ? 6 : s.walking ? 5 : s.car ? 4 : s.trained ? 3 : s.learning ? 2 : s.robot ? 1 : 0;
    const wrong = SCENES.flatMap((s, id) => wasm.scene_kind(id) === kindOf(s) ? [] : [`${id} (${s.name})`]);
    if (wasm.scene_kind(SCENES.length) >>> 0 !== 0xffffffff) wrong.push('scenes after the last one on this page');
    if (wrong.length) console.error(`Scene list out of step with src/scenes.rs: ${wrong.join(', ')}`);
    applyTheme();
    loadScene(9);
    requestAnimationFrame(frame);
  })
  .catch(err => {
    $('note').textContent = `Could not load sim.wasm (${err.message}). Serve this folder over HTTP, for example: python3 -m http.server -d web`;
  });
</script>
